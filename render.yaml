services:
  - type: web
    name: ankimio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANKIMIO_REQUIRE_DATABASE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ANKIMIO_PASSWORD
        generateValue: true
